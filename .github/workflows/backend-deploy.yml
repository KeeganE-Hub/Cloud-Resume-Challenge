name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install pytest boto3 moto

      - name: Run unit tests
        run: pytest backend/tests -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM build
        working-directory: backend
        # --use-container sidesteps a long-standing SAM CLI quirk: its
        # Python version check only looks in a few hardcoded system
        # paths (like /usr/bin/python) and never actually checks
        # wherever actions/setup-python installed Python to - so it
        # fails to "see" 3.14 even though it's genuinely on PATH.
        # Building inside AWS's own container image sidesteps that
        # check entirely, since the right Python version is already
        # sitting exactly where SAM expects it to be.
        run: sam build --use-container

      - name: SAM deploy
        working-directory: backend
        run: >
          sam deploy
          --stack-name cloud-resume-backend
          --capabilities CAPABILITY_IAM
          --resolve-s3
          --no-confirm-changeset
          --no-fail-on-empty-changeset
