<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Courier New', monospace">

  <!-- background -->
  <rect x="0" y="0" width="960" height="700" fill="#0d1420"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff9900"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="480" y="36" text-anchor="middle" fill="#e7ecf5" font-size="20" font-weight="600">Cloud Resume Challenge — Architecture</text>
  <text x="480" y="58" text-anchor="middle" fill="#8f9bb3" font-size="12">keeganelgin.dev</text>

  <!-- Visitor's browser -->
  <rect x="380" y="80" width="200" height="50" rx="6" fill="#17202f" stroke="#ff9900" stroke-width="1.5"/>
  <text x="480" y="110" text-anchor="middle" fill="#e7ecf5" font-size="14">Visitor's Browser</text>

  <!-- ===================== column A: static site delivery ===================== -->
  <text x="140" y="165" text-anchor="middle" fill="#8f9bb3" font-size="11">STATIC SITE</text>

  <rect x="50" y="180" width="180" height="46" rx="6" fill="#17202f" stroke="#3a4356" stroke-width="1.5"/>
  <text x="140" y="208" text-anchor="middle" fill="#e7ecf5" font-size="13">Route 53</text>

  <rect x="50" y="256" width="180" height="46" rx="6" fill="#17202f" stroke="#3a4356" stroke-width="1.5"/>
  <text x="140" y="284" text-anchor="middle" fill="#e7ecf5" font-size="13">CloudFront (HTTPS)</text>

  <rect x="50" y="332" width="180" height="46" rx="6" fill="#17202f" stroke="#3a4356" stroke-width="1.5"/>
  <text x="140" y="360" text-anchor="middle" fill="#e7ecf5" font-size="13">S3 (HTML/CSS/JS)</text>

  <!-- ===================== column B: REST counter (Part 3) ===================== -->
  <text x="480" y="165" text-anchor="middle" fill="#8f9bb3" font-size="11">REST COUNTER — PART 3</text>

  <rect x="390" y="180" width="180" height="46" rx="6" fill="#17202f" stroke="#3a4356" stroke-width="1.5"/>
  <text x="480" y="203" text-anchor="middle" fill="#e7ecf5" font-size="13">API Gateway</text>
  <text x="480" y="218" text-anchor="middle" fill="#8f9bb3" font-size="11">(REST)</text>

  <rect x="390" y="256" width="180" height="46" rx="6" fill="#17202f" stroke="#3a4356" stroke-width="1.5"/>
  <text x="480" y="279" text-anchor="middle" fill="#e7ecf5" font-size="13">Lambda</text>
  <text x="480" y="294" text-anchor="middle" fill="#8f9bb3" font-size="11">app.py</text>

  <!-- ===================== column C: WebSocket counter (Part 8) ===================== -->
  <text x="820" y="165" text-anchor="middle" fill="#8f9bb3" font-size="11">REAL-TIME COUNTER — PART 8</text>

  <rect x="730" y="180" width="180" height="46" rx="6" fill="#17202f" stroke="#ff9900" stroke-width="1.5"/>
  <text x="820" y="203" text-anchor="middle" fill="#e7ecf5" font-size="13">API Gateway</text>
  <text x="820" y="218" text-anchor="middle" fill="#8f9bb3" font-size="11">(WebSocket)</text>

  <rect x="730" y="256" width="180" height="46" rx="6" fill="#17202f" stroke="#ff9900" stroke-width="1.5"/>
  <text x="820" y="279" text-anchor="middle" fill="#e7ecf5" font-size="13">Lambda</text>
  <text x="820" y="294" text-anchor="middle" fill="#8f9bb3" font-size="11">dbupdater.py</text>

  <!-- shared DynamoDB table -->
  <rect x="530" y="332" width="220" height="52" rx="6" fill="#17202f" stroke="#ff9900" stroke-width="1.5"/>
  <text x="640" y="355" text-anchor="middle" fill="#e7ecf5" font-size="13">DynamoDB</text>
  <text x="640" y="371" text-anchor="middle" fill="#8f9bb3" font-size="11">resume-visitor-count</text>

  <!-- connections table -->
  <rect x="780" y="332" width="150" height="52" rx="6" fill="#17202f" stroke="#3a4356" stroke-width="1.5"/>
  <text x="855" y="355" text-anchor="middle" fill="#e7ecf5" font-size="12">DynamoDB</text>
  <text x="855" y="371" text-anchor="middle" fill="#8f9bb3" font-size="10">connection-ids</text>

  <!-- DynamoDB Streams -->
  <rect x="530" y="418" width="220" height="46" rx="6" fill="#17202f" stroke="#ff9900" stroke-width="1.5"/>
  <text x="640" y="441" text-anchor="middle" fill="#e7ecf5" font-size="13">DynamoDB Streams</text>
  <text x="640" y="456" text-anchor="middle" fill="#8f9bb3" font-size="10">fires on every write</text>

  <rect x="730" y="494" width="180" height="46" rx="6" fill="#17202f" stroke="#ff9900" stroke-width="1.5"/>
  <text x="820" y="517" text-anchor="middle" fill="#e7ecf5" font-size="13">Lambda</text>
  <text x="820" y="532" text-anchor="middle" fill="#8f9bb3" font-size="11">dbstreamprocessor.py</text>

  <!-- ===================== CI/CD row ===================== -->
  <rect x="60" y="600" width="840" height="70" rx="6" fill="#17202f" stroke="#3a4356" stroke-width="1.5"/>
  <text x="480" y="628" text-anchor="middle" fill="#e7ecf5" font-size="14">GitHub Actions</text>
  <text x="480" y="648" text-anchor="middle" fill="#8f9bb3" font-size="11">frontend-deploy.yml syncs to S3 + invalidates CloudFront · backend-deploy.yml runs pytest, then sam deploy</text>

  <!-- ================= arrows ================= -->

  <!-- browser down to each column -->
  <line x1="440" y1="130" x2="150" y2="178" stroke="#8f9bb3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="150" fill="#8f9bb3" font-size="10">HTTPS</text>

  <line x1="480" y1="130" x2="480" y2="178" stroke="#8f9bb3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="150" fill="#8f9bb3" font-size="10">GET /count</text>

  <line x1="530" y1="130" x2="800" y2="178" stroke="#ff9900" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="145" fill="#ff9900" font-size="10">wss:// $connect</text>

  <!-- column A internal -->
  <line x1="140" y1="226" x2="140" y2="254" stroke="#8f9bb3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="302" x2="140" y2="330" stroke="#8f9bb3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- column B internal -->
  <line x1="480" y1="226" x2="480" y2="254" stroke="#8f9bb3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="302" x2="600" y2="330" stroke="#8f9bb3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- column C internal -->
  <line x1="820" y1="226" x2="820" y2="254" stroke="#ff9900" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="302" x2="700" y2="330" stroke="#ff9900" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="320" fill="#8f9bb3" font-size="9">increments count</text>

  <line x1="800" y1="302" x2="850" y2="330" stroke="#8f9bb3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="320" fill="#8f9bb3" font-size="9">saves connection</text>

  <!-- visitor count table -> streams -->
  <line x1="640" y1="384" x2="640" y2="416" stroke="#ff9900" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- streams -> DBStreamProcessor -->
  <line x1="750" y1="441" x2="800" y2="492" stroke="#ff9900" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DBStreamProcessor -> connections table (reads who's connected) -->
  <line x1="855" y1="494" x2="855" y2="386" stroke="#8f9bb3" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="865" y="440" fill="#8f9bb3" font-size="9">looks up</text>

  <!-- DBStreamProcessor pushes back to browser, over the websocket -->
  <path d="M 820 492 C 820 300, 950 260, 950 105 C 950 90, 700 90, 585 100"
        fill="none" stroke="#ff9900" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="870" y="300" fill="#ff9900" font-size="10" transform="rotate(-90 870 300)">pushes new count live</text>

  <!-- CI/CD arrows -->
  <line x1="200" y1="600" x2="150" y2="380" stroke="#8f9bb3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="500" fill="#8f9bb3" font-size="9" transform="rotate(-90 160 500)">deploys frontend</text>

  <line x1="600" y1="600" x2="620" y2="386" stroke="#8f9bb3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="605" y="500" fill="#8f9bb3" font-size="9" transform="rotate(-90 605 500)">sam deploy</text>

</svg>
