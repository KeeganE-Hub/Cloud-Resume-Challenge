<svg viewBox="0 0 800 830" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <rect x="0" y="0" width="800" height="830" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <text x="30" y="34" fill="#222222" font-size="18" font-weight="bold">Cloud Resume Challenge — Visitor Counter Architecture</text>

  <!-- single-row legend, tucked into the gap between the title and the
       first row of icons so it doesn't compete for space with S3 -->
  <line x1="485" y1="50" x2="510" y2="50" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="517" y="54" font-size="11" fill="#333333">writes / invokes</text>
  <line x1="620" y1="50" x2="645" y2="50" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <text x="652" y="54" font-size="11" fill="#666666">reads / pushes back</text>

  <!-- ============ Browser icon (top left) ============ -->
  <g>
    <rect x="30" y="70" width="72" height="52" rx="4" fill="none" stroke="#222222" stroke-width="3"/>
    <line x1="66" y1="122" x2="66" y2="138" stroke="#222222" stroke-width="3"/>
    <line x1="46" y1="138" x2="86" y2="138" stroke="#222222" stroke-width="3"/>
    <text x="66" y="158" text-anchor="middle" fill="#222222" font-size="12">Visitor's</text>
    <text x="66" y="172" text-anchor="middle" fill="#222222" font-size="12">browser</text>
  </g>

  <!-- ============ Frontend delivery row ============ -->

  <!-- Route 53 -->
  <g>
    <rect x="220" y="70" width="70" height="70" rx="10" fill="#8C4FFF"/>
    <circle cx="255" cy="98" r="16" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="239" y1="98" x2="271" y2="98" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="255" cy="98" rx="7" ry="16" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="255" y="160" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">Route 53</text>
    <text x="255" y="176" text-anchor="middle" fill="#666666" font-size="11">DNS + domain</text>
  </g>

  <!-- CloudFront -->
  <g>
    <rect x="410" y="70" width="70" height="70" rx="10" fill="#8C4FFF"/>
    <circle cx="445" cy="105" r="20" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="445" cy="105" r="4" fill="#ffffff"/>
    <line x1="445" y1="85" x2="445" y2="95" stroke="#ffffff" stroke-width="2"/>
    <line x1="445" y1="115" x2="445" y2="125" stroke="#ffffff" stroke-width="2"/>
    <line x1="425" y1="105" x2="435" y2="105" stroke="#ffffff" stroke-width="2"/>
    <line x1="455" y1="105" x2="465" y2="105" stroke="#ffffff" stroke-width="2"/>
    <text x="445" y="160" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">CloudFront</text>
    <text x="445" y="176" text-anchor="middle" fill="#666666" font-size="11">HTTPS + caching</text>
  </g>

  <!-- S3 static site -->
  <g>
    <rect x="600" y="70" width="70" height="70" rx="10" fill="#7AA116"/>
    <path d="M618,84 h28 v6 h-28 z M618,96 h28 v6 h-28 z M618,108 h28 v6 h-28 z M618,120 h28 v6 h-28 z"
          fill="#ffffff"/>
    <text x="635" y="160" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">S3</text>
    <text x="635" y="176" text-anchor="middle" fill="#666666" font-size="11">HTML / CSS / JS</text>
  </g>

  <line x1="102" y1="96" x2="218" y2="96" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="86" text-anchor="middle" font-size="11" fill="#333333">keeganonthecloud.com</text>

  <line x1="290" y1="96" x2="408" y2="96" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="349" y="86" text-anchor="middle" font-size="11" fill="#333333">resolves to</text>

  <line x1="480" y1="96" x2="598" y2="96" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="539" y="86" text-anchor="middle" font-size="11" fill="#333333">origin fetch (OAC)</text>

  <path d="M635,140 V220 H66 V182" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="212" text-anchor="middle" font-size="11" fill="#333333">serves cached HTML/CSS/JS over HTTPS</text>

  <!-- ============ WebSocket counter row ============ -->

  <!-- WebSocket API -->
  <g>
    <rect x="220" y="260" width="70" height="70" rx="10" fill="#8C4FFF"/>
    <path d="M240,275 l10,15 l-10,15 M280,275 l-10,15 l10,15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="255" y="350" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">API Gateway</text>
    <text x="255" y="366" text-anchor="middle" fill="#666666" font-family="Courier New, monospace" font-size="11">WebSocketApi</text>
  </g>

  <!-- DBUpdaterFunction -->
  <g>
    <rect x="410" y="260" width="70" height="70" rx="10" fill="#ED7100"/>
    <path d="M430,275 L430,315 M430,275 L455,315 M448,275 L455,315" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="445" y="350" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">Lambda</text>
    <text x="445" y="366" text-anchor="middle" fill="#666666" font-family="Courier New, monospace" font-size="11">DBUpdaterFunction</text>
  </g>

  <!-- VisitorCountTable -->
  <g>
    <rect x="600" y="260" width="70" height="70" rx="10" fill="#4053D6"/>
    <ellipse cx="635" cy="280" rx="20" ry="7" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M615,280 v20 a20,7 0 0 0 40,0 v-20" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M615,290 a20,7 0 0 0 40,0" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="635" y="350" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">DynamoDB</text>
    <text x="635" y="366" text-anchor="middle" fill="#666666" font-family="Courier New, monospace" font-size="11">VisitorCountTable</text>
  </g>

  <!-- ConnectionIdsTable -->
  <g>
    <rect x="600" y="410" width="70" height="70" rx="10" fill="#4053D6"/>
    <ellipse cx="635" cy="430" rx="20" ry="7" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M615,430 v20 a20,7 0 0 0 40,0 v-20" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M615,440 a20,7 0 0 0 40,0" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="635" y="500" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">DynamoDB</text>
    <text x="635" y="516" text-anchor="middle" fill="#666666" font-family="Courier New, monospace" font-size="11">ConnectionIdsTable</text>
  </g>

  <!-- DBStreamProcessorFunction -->
  <g>
    <rect x="410" y="410" width="70" height="70" rx="10" fill="#ED7100"/>
    <path d="M430,425 L430,465 M430,425 L455,465 M448,425 L455,465" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="445" y="500" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">Lambda</text>
    <text x="445" y="516" text-anchor="middle" fill="#666666" font-family="Courier New, monospace" font-size="11">DBStreamProcessorFn</text>
  </g>

  <!-- browser <-> websocket -->
  <line x1="66" y1="182" x2="66" y2="260" stroke="#333333" stroke-width="1.5"/>
  <line x1="66" y1="260" x2="218" y2="286" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="270" text-anchor="middle" font-size="11" fill="#333333">opens wss:// ($connect)</text>

  <line x1="218" y1="304" x2="66" y2="270" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="316" text-anchor="middle" font-size="11" fill="#333333">pushes live count</text>

  <!-- websocket -> dbupdater (single arrow - both $connect and $disconnect
       invoke the same Lambda, so one arrow covers both instead of implying
       a back-and-forth) -->
  <line x1="290" y1="295" x2="408" y2="295" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="349" y="272" text-anchor="middle" font-size="11" fill="#333333">invokes on</text>
  <text x="349" y="286" text-anchor="middle" font-size="11" fill="#333333">$connect / $disconnect</text>

  <!-- dbupdater -> visitorcounttable -->
  <line x1="480" y1="286" x2="598" y2="286" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="539" y="276" text-anchor="middle" font-size="11" fill="#333333">UpdateItem: count +1</text>

  <!-- dbupdater -> connectionidstable -->
  <path d="M462,330 V445 H598" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="392" font-size="11" fill="#333333">PutItem:</text>
  <text x="470" y="406" font-size="11" fill="#333333">connection ID</text>

  <!-- visitorcounttable -> streamprocessor. Routed up and over
       ConnectionIdsTable (via the gap between the two rows) rather
       than straight down, since a direct vertical line would have
       cut right through that box - it sits directly below
       VisitorCountTable in the same column. -->
  <path d="M635,330 V380 H420 V408" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="527" y="373" text-anchor="middle" font-size="11" fill="#333333">DynamoDB Stream event</text>

  <!-- streamprocessor -> connectionidstable (dashed, read) -->
  <line x1="480" y1="458" x2="598" y2="458" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <text x="539" y="474" text-anchor="middle" font-size="11" fill="#666666">scans open connections</text>

  <!-- streamprocessor -> websocketapi (dashed, push back up - routed through
       the clear gap below row 2 so it doesn't cross the connect/disconnect
       arrows above it) -->
  <path d="M445,410 V368 H255 V330" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

  <!-- ============ CI/CD row ============ -->

  <g>
    <circle cx="255" cy="640" r="34" fill="#1b1f23"/>
    <path d="M255,618 c-13,0 -23,10 -23,23 c0,10 7,19 16,22 c1,0 2,-1 2,-2 v-6 c-6,1 -8,-3 -8,-3 c-2,-3 -4,-4 -4,-4 c-3,-2 0,-2 0,-2 c3,0 5,3 5,3 c3,5 8,3 9,2 c0,-2 1,-4 2,-4 c-5,-1 -11,-3 -11,-12 c0,-3 1,-5 3,-7 c0,-1 -1,-4 1,-8 c0,0 2,-1 7,3 c2,-1 4,-1 6,-1 c2,0 4,0 6,1 c5,-4 7,-3 7,-3 c2,4 1,7 1,8 c2,2 3,4 3,7 c0,9 -6,11 -11,12 c1,1 2,3 2,5 v7 c0,1 1,2 2,2 c9,-3 16,-12 16,-22 c0,-13 -10,-23 -23,-23 z" fill="#ffffff"/>
    <text x="255" y="694" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">GitHub Actions</text>
    <text x="255" y="710" text-anchor="middle" fill="#666666" font-size="11">on push to main</text>
  </g>

  <rect x="30" y="750" width="370" height="60" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="215" y="774" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">frontend-deploy.yaml</text>
  <text x="215" y="792" text-anchor="middle" fill="#555555" font-size="11">aws s3 sync + CloudFront invalidation</text>
  <text x="215" y="806" text-anchor="middle" fill="#888888" font-size="10">uses repo Secrets (IAM keys) + Variables (bucket, URLs)</text>

  <rect x="420" y="750" width="370" height="60" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="605" y="774" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">backend-deploy.yaml</text>
  <text x="605" y="792" text-anchor="middle" fill="#555555" font-size="11">pytest, then sam build --use-container + sam deploy</text>
  <text x="605" y="806" text-anchor="middle" fill="#888888" font-size="10">uses repo Secrets (IAM keys)</text>

  <path d="M221,640 H100 V748" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M289,640 H605 V748" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M70,748 V560 H700 V105 L672,105" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arrow)"/>
  <text x="78" y="650" font-size="10" fill="#999999">deploys to</text>

  <line x1="605" y1="748" x2="635" y2="480" stroke="#333333" stroke-width="1.2" stroke-dasharray="2,3"/>
  <text x="613" y="600" font-size="10" fill="#999999">deploys to</text>

</svg>
